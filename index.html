<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЖК «Крылья» — выбор квартиры</title>
  <link rel="stylesheet" href="shahmatka.css?v=15">
  <style>
    body { margin: 0; background: #eef2f6; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .page { max-width: 1180px; margin: 28px auto; padding: 0 18px; }
    .page__note { font-size: 13px; color: #6b7785; margin-top: 22px; line-height: 1.6; }
    .page__note code { color: #48607a; }
  </style>
</head>
<body>
  <div class="page">
    <div id="shahmatka"></div>
    <p class="page__note">
      Выбор квартиры в ЖК «Крылья» (Тверь): генплан с подъездами → фильтры, карточки планировок, шахматка.
      Данные из фида застройщика — <code>data.json</code> (97 квартир, подъезды 7–10). Заявка прокидывается в колбэк
      <code>onLead</code> для интеграции с формой сайта / amoCRM.
    </p>
  </div>

  <script src="shahmatka.js?v=15"></script>
  <script>
    Shahmatka.init({
      container: '#shahmatka',
      dataUrl: 'data.json?v=15',
      // Тема под бренд клиента (можно также задать в data.json — theme/accent):
      theme: 'light',        // 'light' | 'dark' (по умолчанию тёмная)
      accent: '#c8a15a',     // ВРЕМЕННЫЙ акцент — заменить на фирменный hex «Крыльев»
      onLead: function (flat) {
        alert('Заявка: кв. №' + flat.number + ', ' + flat.area + ' м², ' + flat.price.toLocaleString('ru-RU') + ' ₽');
      }
    });
  </script>
</body>
</html>
